name: Publish CET300 preview.14 manual hotfix
# trigger-v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-preview14-manual.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified hotfix artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a9f0-8211-94e7-082cdb506477/raw?se=2026-10-04T16%3A01%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=45393e41-450f-5dfe-ab02-df84494dfd20&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T18%3A55%3A02Z&ske=2026-10-04T18%3A55%3A02Z&sks=b&skv=2026-02-06&sig=36ekGexSrlg/TQwdw%2BGW/X%2BPyF6MGSrucAjX/TixhjI%3D"
          EXPECTED_SHA256: "966787ee3d5dce8fce050a0983557902b2d6a104f105b3925ca567b9d59db1a6"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          unzip -j artifact.zip 'CET300_1.1.0-preview.14_x64-setup.exe' -d .
          echo "$EXPECTED_SHA256  CET300_1.1.0-preview.14_x64-setup.exe" | sha256sum -c -

      - name: Publish manual hotfix prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.0-preview.14-manual
          FILE: CET300_1.1.0-preview.14_x64-setup.exe
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "CET300 1.1.0-preview.14 Manual Hotfix" \
            --notes "Manual hotfix for the Day rollover bug. Install over the existing CET300; learning progress is preserved because the app identifier is unchanged. SHA256: 966787ee3d5dce8fce050a0983557902b2d6a104f105b3925ca567b9d59db1a6" \
            --prerelease
